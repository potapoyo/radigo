name: Build

on:
  push:
    branches:
      - fix/timefree-endpoint
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build -o radigo-linux-arm64 ./cmd/radigo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radigo-linux-arm64
          path: radigo-linux-arm64
          retention-days: 7
